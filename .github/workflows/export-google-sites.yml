name: Export Google Sites Embed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - 'sprites/**'
      - 'scripts/build_google_sites.py'
      - '.github/workflows/export-google-sites.yml'
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install Pillow==11.3.0
      - name: Build self-contained Google Sites HTML
        run: python scripts/build_google_sites.py
      - name: Compress HTML and JavaScript for Google Sites
        run: |
          npx --yes html-minifier-terser@7.2.0 google-sites/embed-code.txt \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            --output google-sites/embed-code.min.txt
          test -s google-sites/embed-code.min.txt
          mv google-sites/embed-code.min.txt google-sites/embed-code.txt
          wc -c google-sites/embed-code.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roots-resort-google-sites
          path: google-sites/embed-code.txt
